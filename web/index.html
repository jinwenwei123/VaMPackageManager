</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#" aria-label="VaM 包管家首页"><svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="var(--green)"/><path d="m16 23 16-9 16 9v19l-16 9-16-9Z" fill="none" stroke="var(--on-primary)" stroke-width="3" stroke-linejoin="round"/><path d="m16 23 16 9 16-9M32 32v19m-8-32 16 9" fill="none" stroke="var(--on-primary)" stroke-width="3" stroke-linejoin="round"/></svg><span>VaM <b>包管家</b><small>让资源井然有序</small></span></a>
    <span class="nav-label">工作空间</span>
    <nav aria-label="主导航" id="navigation"></nav>
    <div class="sidebar-bottom"><div class="local-indicator"><i></i> 本地资源 · 本地管理</div><button class="nav-item" data-page="settings"><span>⚙</span> AI 与设置</button><div class="version">PACKAGE MANAGER <span>1.0.0</span></div></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb"><button id="workspace-name" class="linklike" data-home-settings="directories" aria-label="管理游戏目录">我的 VaM</button> <span>/</span> <b id="breadcrumb">主页</b></div><div class="top-actions"><span id="scan-time"></span><button class="button icon theme-toggle" data-action="toggle-theme" title="切换深色模式" aria-label="切换深色模式">☾</button><button class="button small" data-action="scan" title="扫描并按当前方案同步启停；未应用方案时仅启用固定基础包">↻ 更新索引</button><button class="button primary small" data-action="launch">▷ 启动 VaM</button></div></header>
    <div id="recovery-banner" class="recovery hidden"><span>有文件操作尚未完成，请先恢复。</span><button class="button small" data-page="history">查看记录</button></div>
    <div id="workspace-offline" class="recovery hidden"><span>当前游戏目录不可用，已有数据保留。请连接磁盘或选择其他目录。</span><button class="button small" data-home-settings="directories">切换目录</button></div>
    <main id="main"><div class="empty"><div class="spinner"></div><h2>正在连接本地资源库</h2></div></main>
    <footer><span>VA MATE · YOUR COLLECTION, SIMPLIFIED</span><span id="footer-status">所有更改均可追溯</span></footer>
  </div>
  <section id="job-panel" class="job-panel hidden" aria-live="polite"></section>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="drawer-backdrop" class="backdrop hidden"><aside id="drawer" class="drawer" aria-label="资源详情"></aside></div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <dialog id="preset-dialog" aria-labelledby="preset-heading"></dialog>
